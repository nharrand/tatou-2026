server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'compose_project'
      - source_labels: ['__meta_docker_container_id']
        target_label: '__path__'
        replacement: /var/lib/docker/containers/$1/$1-json.log
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{compose_service=~".+"}'
          stages:
            - regex:
                expression: '(?i)(?P<log_error>error|exception|critical|fatal|traceback)'
            - metrics:
                log_errors_total:
                  type: Counter
                  description: "Total application error logs"
                  source: log_error
                  config:
                    action: inc
      - match:
          selector: '{compose_service="server"}'
          stages:
            - regex:
                expression: '(?i)(?P<auth_attack>429|ratelimit|rate-limit|too many requests|invalid auth|invalid credentials|unauthorized)'
            - metrics:
                auth_attacks_total:
                  type: Counter
                  description: "Total authentication attack or rate limit triggers"
                  source: auth_attack
                  config:
                    action: inc
            - regex:
                expression: '.* "(?:GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS) [^\s]+ [^"]*" (?P<http_5xx>5[0-9]{2}) .*'
            - metrics:
                http_5xx_errors_total:
                  type: Counter
                  description: "HTTP 5xx server errors"
                  source: http_5xx
                  config:
                    action: inc
